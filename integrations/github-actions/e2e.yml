# Runs the Playwright suite in CI. Copy to .github/workflows/e2e.yml.
#
# The suite's only dependency is a running application at BASE_URL, so the
# "Start the application" step is the one part that is yours: a compose stack,
# a preview deployment, or the dev server started in the background.
name: E2E Tests

on:
  # ADAPT: choose the trigger — push to main, pull_request, or a deploy workflow calling this one.
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node >= 23.6 strips types natively; the harness scripts rely on it.
          node-version: 24

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the application
        # ADAPT: start whatever serves BASE_URL, and wait until it answers; `--wait` on a compose stack, or a curl loop against the dev server.
        run: echo "start the application here"
        timeout-minutes: 15

      - name: Run E2E tests
        working-directory: e2e
        env:
          # ADAPT: BASE_URL of the application started above, and the test user the specs log in as.
          BASE_URL: http://localhost:4200
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      # The HTML report is for humans; the traces are what an agent reads to
      # tell a changed identifier from a broken feature.
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

      - name: Stop the application
        if: always()
        # ADAPT: tear down what "Start the application" started, or drop this step.
        run: echo "stop the application here"
